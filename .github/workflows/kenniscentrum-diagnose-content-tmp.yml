name: Kenniscentrum content diagnose (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend om de titel+meta-description op
# te halen van de 30 al bekende, vastgestelde Rijksoverheid/Financien-URL's
# uit de vorige diagnose, voor een inhoudelijke audit. Geen nieuwe
# discovery, geen scoring, geen schrijfacties naar src/content, geen
# commit/push-stap. Wordt na gebruik weer verwijderd, samen met
# scripts/kenniscentrum/diagnose-fetch-content.mjs en diagnose-urls.json.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Content ophalen (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-fetch-content.mjs
