name: "KVK dry-run (Kenniscentrum)"

# Fase 1-dry-run van de KVK-source (scripts/kenniscentrum/sources.config.mjs,
# id "kvk-kennisartikelen"). Voert de volledige discovery- en filterpijplijn
# uit (sitemap_index.xml -> documents-*.xml -> URL-/relevantiefilter ->
# artikelpagina's -> eindfilter) maar schrijft nooit content weg, wijzigt
# geen bestaande artikelen en commit niets.
#
# Gebruikt om de daadwerkelijk geselecteerde KVK-kandidaten te kunnen
# beoordelen vóórdat de bron in sources.config.mjs op enabled:true gezet
# wordt. Handmatig te starten vanuit het "Actions"-tabblad.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          # package.json vereist (engines.node) Node 24.x; Node 20 gaf een
          # EBADENGINE-waarschuwing bij npm ci.
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: KVK dry-run uitvoeren (alleen lezen, geen wijzigingen)
        run: node scripts/kenniscentrum/dry-run-kvk.mjs
