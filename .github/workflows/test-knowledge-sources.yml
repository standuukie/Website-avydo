name: "TIJDELIJK: test Kenniscentrum-bronnen (KVK)"

# TIJDELIJKE, GEÏSOLEERDE TESTWORKFLOW — géén onderdeel van de productie-
# Kenniscentrum-pipeline. Wijzigt niets, voegt geen content toe, schrijft
# niets weg en commit niets.
#
# Ronde 3 (KVK-only): ronde 2 vond in __NEXT_DATA__ alleen "siteMenuItems"
# (navigatie), geen artikeldata. Deze ronde zoekt gerichter: server-rendered
# HTML rond echte artikel-links, ALLE embedded JSON-datasets (niet alleen de
# eerste match), Next.js' eigen publieke per-pagina data-route
# (/_next/data/<buildId>/…, een gedocumenteerd publiek mechanisme), en de
# sitemapstructuur (sitemap/pages.xml + documents-*.xml). Alleen publieke
# URL's, geen reverse engineering van private endpoints.
#
# Haalt alleen de publieke pagina op zoals een gewone browser dat zou doen
# (geen login, geen cookies, geen paywall-/toegangsomzeiling).
#
# Kan na gebruik worden verwijderd.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: KVK-structuur testen (alleen lezen, geen wijzigingen)
        run: node .github/workflows/scripts/probe-knowledge-sources.mjs
