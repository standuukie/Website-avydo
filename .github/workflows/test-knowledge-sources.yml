name: "TIJDELIJK: test Kenniscentrum-bronnen (KVK)"

# TIJDELIJKE, GEÏSOLEERDE TESTWORKFLOW — géén onderdeel van de productie-
# Kenniscentrum-pipeline. Wijzigt niets, voegt geen content toe, schrijft
# niets weg en commit niets.
#
# Ronde 2 (KVK-only): FD is komen te vervallen — geen commerciële licentie,
# zie het Kenniscentrum-auditrapport van 2026-10-01. Deze ronde onderzoekt
# uitsluitend de daadwerkelijke, ruwe __NEXT_DATA__/JSON-structuur van
# https://www.kvk.nl/overzicht/ (en sitemap_index.xml), zodat de productie-
# parsing op geverifieerde data gebaseerd kan worden in plaats van aannames.
#
# Haalt alleen de publieke pagina op zoals een gewone browser dat zou doen
# (geen login, geen cookies, geen paywall-/toegangsomzeiling).
#
# Kan na gebruik worden verwijderd.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: KVK-structuur testen (alleen lezen, geen wijzigingen)
        run: node .github/workflows/scripts/probe-knowledge-sources.mjs
