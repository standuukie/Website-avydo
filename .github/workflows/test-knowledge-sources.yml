name: "TIJDELIJK: test Kenniscentrum-bronnen (KVK)"

# TIJDELIJKE, GEÏSOLEERDE TESTWORKFLOW — géén onderdeel van de productie-
# Kenniscentrum-pipeline. Wijzigt niets, voegt geen content toe, schrijft
# niets weg en commit niets.
#
# Ronde 4 (KVK-only): rondes 1-3 sloten __NEXT_DATA__ (alleen "siteMenuItems")
# en de Next.js-data-route (404) uit als bruikbare bron. Deze ronde
# onderzoekt gericht of sitemap_index.xml → documents-*.xml een betrouwbare
# artikelindex is (tellingen, <lastmod>, zoeken naar drie bekende,
# nu-zichtbare artikel-slugs), met als cross-check ook de publieke HTML van
# diezelfde drie artikelpagina's (title/meta/canonical/JSON-LD/datum).
# Alleen publieke URL's, geen reverse engineering van private endpoints.
#
# Haalt alleen de publieke pagina op zoals een gewone browser dat zou doen
# (geen login, geen cookies, geen paywall-/toegangsomzeiling).
#
# Kan na gebruik worden verwijderd.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: KVK-structuur testen (alleen lezen, geen wijzigingen)
        run: node .github/workflows/scripts/probe-knowledge-sources.mjs
