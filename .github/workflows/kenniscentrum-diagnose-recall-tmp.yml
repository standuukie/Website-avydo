name: Kenniscentrum recall-study diagnose (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend voor een read-only recall-
# onderzoek naar de Rijksoverheid-relevancefilter (commit 3859281-
# equivalent): scant gestratificeerd over de volledige sitemap-
# kandidatenlijst naar echte Ministerie van Financiën-artikelen en haalt
# voor elk gevonden artikel de volledige paginatekst op. Geen
# schrijfacties naar src/content, geen commit/push-stap in de workflow
# zelf, publiceert niets. Wordt na gebruik weer verwijderd, samen met
# scripts/kenniscentrum/diagnose-recall-study.mjs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Recall-onderzoek draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-recall-study.mjs
        timeout-minutes: 45
