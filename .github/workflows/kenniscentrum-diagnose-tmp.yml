name: Kenniscentrum ministryBypass diagnose (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend voor een read-only validatie van
# de ministryBypass-uitsluitingslijst (commit c82c8d3) tegen echte
# Rijksoverheid-kandidaten buiten de normale 100-cap. Schrijft NOOIT naar
# src/content/kenniscentrum en heeft geen commit/push-stap. Wordt na gebruik
# weer verwijderd, samen met scripts/kenniscentrum/diagnose-ministry-bypass.mjs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Diagnose draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-ministry-bypass.mjs
