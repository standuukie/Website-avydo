name: Kenniscentrum Rijksoverheid netwerkrequest-diagnose (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend voor een read-only onderzoek
# naar de daadwerkelijke netwerkrequest die rijksoverheid.nl's
# gefilterde nieuwspagina gebruikt om artikelen client-side op te
# halen. Gebruikt een echte, headless Chromium-browser (Playwright) om
# alle netwerkverkeer tijdens het laden van de pagina vast te leggen.
# Playwright wordt alleen via "npm install --no-save" toegevoegd (geen
# wijziging aan package.json/package-lock.json). Geen schrijfacties naar
# src/content, geen commit/push-stap in de workflow zelf, publiceert
# niets. Wordt na gebruik weer verwijderd, samen met
# scripts/kenniscentrum/diagnose-rijksoverheid-network-capture.mjs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Playwright tijdelijk installeren (niet opgeslagen in package.json)
        run: npm install --no-save playwright

      - name: Chromium-browser installeren voor Playwright
        run: npx playwright install --with-deps chromium

      - name: Netwerkrequest-onderzoek draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-rijksoverheid-network-capture.mjs
        timeout-minutes: 15
