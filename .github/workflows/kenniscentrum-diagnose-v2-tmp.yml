name: Kenniscentrum ministryBypass diagnose v2 (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend voor een read-only validatie van
# de nieuwe ministryBypass-fiscale-stam-eis (commit 3859281) tegen echte
# Rijksoverheid-kandidaten verder in de sitemap dan de normale 100-cap en
# verder dan de vorige audit al scande. Schrijft NOOIT naar
# src/content/kenniscentrum en heeft geen commit/push-stap. Wordt na
# gebruik weer verwijderd, samen met
# scripts/kenniscentrum/diagnose-ministry-bypass-v2.mjs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Diagnose draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-ministry-bypass-v2.mjs
