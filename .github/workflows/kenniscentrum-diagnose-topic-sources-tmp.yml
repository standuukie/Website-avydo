name: Kenniscentrum Rijksoverheid topicbronnen diagnose (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend voor een read-only onderzoek naar
# 7 Rijksoverheid-topicpagina's als mogelijke vervanging/aanvulling op de
# huidige algemene sitemap-bron. Geen schrijfacties naar src/content, geen
# commit/push-stap in de workflow zelf, publiceert niets. Wordt na gebruik
# weer verwijderd, samen met scripts/kenniscentrum/diagnose-topic-sources.mjs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Topicbronnen-onderzoek draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-topic-sources.mjs
        timeout-minutes: 30
