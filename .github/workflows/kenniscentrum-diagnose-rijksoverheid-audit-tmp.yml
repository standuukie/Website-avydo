name: Kenniscentrum Rijksoverheid-waardeaudit diagnose (tijdelijk, read-only)

# TIJDELIJK workflow-bestand, uitsluitend voor een read-only waarde-audit
# van de Rijksoverheid-bron: scant gestratificeerd over de volledige
# sitemap-kandidatenlijst naar een representatieve steekproef (begin/
# midden/einde van de lijst) en haalt voor elk gevonden artikel de
# volledige paginatekst + technische relevantiesignalen op. Geen
# schrijfacties naar src/content, geen commit/push-stap in de workflow
# zelf, publiceert niets. Wordt na gebruik weer verwijderd, samen met
# scripts/kenniscentrum/diagnose-rijksoverheid-audit.mjs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Rijksoverheid-waardeaudit draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-rijksoverheid-audit.mjs
        timeout-minutes: 45
