name: Dry-run Rijksoverheid discovery (tijdelijk, alleen-lezen)

# Tijdelijk verificatiescript, NIET onderdeel van de productie-pipeline en
# commit niets. Laatste stap van het onderzoek (zie git-historie van dit
# bestand voor de eerdere onderzoeksrondes): roept de NIEUWE
# fetchRijksoverheidGeneralSitemapUrls-functie uit fetch-articles.mjs
# rechtstreeks aan, live tegen rijksoverheid.nl, om te bevestigen dat de
# daadwerkelijke implementatie (niet alleen losse URL-probes) werkt zoals
# verwacht. KENNISCENTRUM_CONTENT_DIR wijst naar een tijdelijke map, dus er
# wordt nooit in de echte content geschreven (en er wordt hier ook geen
# publishItem aangeroepen — alleen de discovery-stap).
#
# Wordt na dit onderzoek weer verwijderd (zelfde patroon als de eerdere
# KVK-dry-run-tooling).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Nieuwe discovery-functie live uitvoeren (geen schrijfactie)
        run: |
          mkdir -p /tmp/kc-dry-run-content
          node --input-type=module -e "
            process.env.KENNISCENTRUM_CONTENT_DIR = '/tmp/kc-dry-run-content';
            const { fetchRijksoverheidGeneralSitemapUrls } = await import('./scripts/kenniscentrum/fetch-articles.mjs');
            const { sources } = await import('./scripts/kenniscentrum/sources.config.mjs');
            const source = sources.find((s) => s.id === 'rijksoverheid-nieuws');
            console.log('Bron-config:', JSON.stringify({ sitemapIndexUrl: source.sitemapIndexUrl, articleUrlPattern: source.articleUrlPattern }));
            const entries = await fetchRijksoverheidGeneralSitemapUrls(source.sitemapIndexUrl, source.articleUrlPattern);
            console.log('Aantal gevonden kandidaten:', entries.length);
            console.log('Nieuwste 10:', JSON.stringify(entries.slice(0, 10).map((e) => ({ loc: e.loc, lastmod: e.lastmod })), null, 2));
            console.log('Oudste 5:', JSON.stringify(entries.slice(-5).map((e) => ({ loc: e.loc, lastmod: e.lastmod })), null, 2));
            const uniqueDates = new Set(entries.map((e) => (e.lastmod || '').slice(0, 10)));
            console.log('Aantal unieke datums (ruwe spreiding):', uniqueDates.size);
          " | tee /tmp/verify-output.txt

      - name: Samenvatting schrijven
        if: always()
        run: |
          echo '## Live verificatie: nieuwe Rijksoverheid-discovery' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/verify-output.txt >> "$GITHUB_STEP_SUMMARY" || echo '(geen output, zie vorige stap)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inhoud van de (tijdelijke, lege) content-map na deze run — moet leeg zijn, geen enkel bestand geschreven:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la /tmp/kc-dry-run-content >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo '(map bestaat niet, nog beter: zeker niets geschreven)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
