name: Kenniscentrum Rijksoverheid topic-matrix-diagnose (tijdelijk, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Playwright tijdelijk installeren (niet opgeslagen in package.json)
        run: npm install --no-save playwright
      - name: Chromium-browser installeren voor Playwright
        run: npx playwright install --with-deps chromium
      - name: Topic-matrix onderzoek draaien (read-only, schrijft niets naar src/content)
        run: node scripts/kenniscentrum/diagnose-rijksoverheid-topic-matrix.mjs
        timeout-minutes: 15
